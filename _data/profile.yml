short_bio: >-
  <p>
    I develop <strong>generative models for flexible and reliable inference</strong>, with a focus on
    masked and discrete diffusion, probabilistic sampling, self-correction, and risk-aware post-training.
    I also apply these methods to communication and sensing systems.
  </p>
  <p>
    My work has appeared at <strong>ICML, CVPR, NeurIPS, and IEEE Transactions on Wireless Communications</strong>.
    I am advised by Prof. Jeffrey G. Andrews and Prof. Hyeji Kim at UT Austin.
  </p>

